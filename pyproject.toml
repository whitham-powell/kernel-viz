[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-visualizer"
version = "0.1.0"
description = "Kernel visualization framework for statistical learning with kernelized perceptron implementation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "pandas",
    "numpy",
    "matplotlib==3.9.3",
    "seaborn",
    "scikit-learn",
    "scipy",
    "ffmpeg-python",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "flake8",
    "black",
    "isort",
    "pytest-cov",
    "pytest",
    "pytest-mpl",
    "mypy",
    "bandit",
    "yamllint",
    "pyyaml",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/your-username/kernel-visualizer"
Repository = "https://github.com/your-username/kernel-visualizer"
Issues = "https://github.com/your-username/kernel-visualizer/issues"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--mpl -v"

[tool.mypy]
disable_error_code = "import-untyped"
strict = true
explicit_package_bases = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.flake8]
ignore = ["E203", "E266", "E501", "W503"]
max-line-length = 88
max-complexity = 18
select = ["B", "C", "E", "F", "W", "T4"]
exclude = [".git", "__pycache__"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."
